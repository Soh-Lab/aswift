name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and package (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test and package dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[developer]" build twine

      - name: Run tests
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          NUMBA_CACHE_DIR: ${{ runner.temp }}/numba
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
