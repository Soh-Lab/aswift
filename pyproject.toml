[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aswift"
version = "1.0.3"
license = "MIT"
description = "ASWIFT peak fitting utilities for square-wave voltammetry"
keywords = ["electrochemistry", "square-wave voltammetry", "peak fitting", "SWV"]
authors = [
    {name = "Max Yates", email = "mlyates@stanford.edu"}
]
readme = {file = "PYPI_README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.15",
    "pybaselines>=1.2",
]

[project.scripts]
aswift-viewer = "aswift.analysis.viewer_cli:main"

[project.urls]
Homepage = "https://github.com/Soh-Lab/aswift"
Repository = "https://github.com/Soh-Lab/aswift"
Documentation = "https://github.com/Soh-Lab/aswift#readme"
"Soh Lab Website" = "https://sohlab.stanford.edu/"

[project.optional-dependencies]
batch = ["pandas>=2.2"]
plot = [
    "matplotlib>=3.10",
    "pandas>=2.2",
]
viewer = [
    "matplotlib>=3.10",
    "pandas>=2.2",
    "plotly>=6.0.0",
    "pypalmsens>=1.9.0",
    # Python.NET 3.1 currently fails to resolve its loader method in the
    # PyInstaller-frozen Windows viewer. Keep the established 3.0 runtime
    # until that upstream frozen-app regression is resolved.
    "pythonnet>=3.0.5,<3.1",
    "streamlit>=1.46",
    "watchdog>=6.0",
]
developer = [
    "aswift[viewer]",
    "pytest>=8.0",
    "pydantic==2.11.4",
]

all = [
    "aswift[developer]",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aswift*"]

[tool.setuptools.package-data]
aswift = ["assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
    "ignore:.*deprecated.*:DeprecationWarning",
]
