[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aswift"
version = "0.1.0"
license = "MIT"
description = "ASWIFT peak fitting utilities for square-wave voltammetry"
authors = [
    {name = "Max Yates", email = "mlyates@stanford.edu"}
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.15",
    "pybaselines>=1.2",
]

[project.scripts]
aswift-viewer = "aswift.analysis.viewer_cli:main"

[project.urls]
Homepage = "https://github.com/Soh-Lab/aswift"
Repository = "https://github.com/Soh-Lab/aswift"
Documentation = "https://github.com"
"Soh Lab Website" = "https://sohlab.stanford.edu/"

[project.optional-dependencies]
plot = ["matplotlib>=3.10"]
viewer = [
    "matplotlib>=3.10",
    "pandas>=2.2",
    "pypalmsens>=1.9.0",
    "streamlit>=1.46",
]
developer = [
    "aswift[viewer]",
    "pytest>=8.0",
    "loguru==0.7.3",
    "pydantic==2.11.4",
]

all = [
    "aswift[developer]",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aswift*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
    "ignore:.*deprecated.*:pyparsing.exceptions.PyparsingDeprecationWarning",
]
